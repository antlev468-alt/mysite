services:
  - type: web
    name: mysite
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn mysite.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        value: "Admin123456!"
      - key: ADMIN_EMAIL
        value: "admin@example.com"