{% extends "admin/login.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    .welcome-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        overflow: hidden;
    }
    .welcome-overlay.show {
        display: flex;
        animation: fadeIn 0.2s ease;
    }
    .welcome-overlay.hide {
        animation: fadeOut 1.5s ease 8s forwards;
    }
    .welcome-text {
        z-index: 10;
        text-align: center;
    }
    .welcome-text .hello {
        font-size: 36px;
        color: #ffd699;
        opacity: 0;
        letter-spacing: 8px;
        margin-bottom: 25px;
        animation: slideDown 0.8s ease 0.3s both;
    }
    .welcome-text .father {
        font-size: 120px;
        font-weight: 900;
        letter-spacing: 10px;
        background: linear-gradient(180deg, #ffffff 0%, #ffdd00 20%, #ff8800 40%, #ff2200 60%, #ff8800 80%, #ffcc00 100%);
        background-size: 100% 150%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: fireShine 0.3s ease-in-out infinite alternate, scaleIn 0.6s ease 0.5s both;
        filter: drop-shadow(0 0 50px #ff4400) drop-shadow(0 0 100px #ff6600) drop-shadow(0 0 150px #ff0000);
    }
    .welcome-text .subtitle {
        font-size: 24px;
        color: #ffcc66;
        opacity: 0;
        letter-spacing: 10px;
        margin-top: 30px;
        animation: slideUp 0.8s ease 1s both, pulseGlow 1s ease-in-out 2s infinite;
    }

    /* Фоновый огонь */
    .bg-fire {
        position: absolute;
        bottom: -100px;
        left: -10%;
        width: 120%;
        height: 70%;
        background: radial-gradient(ellipse at center bottom,
            rgba(255,100,0,0.6) 0%,
            rgba(255,50,0,0.4) 30%,
            rgba(255,20,0,0.2) 60%,
            transparent 80%);
        z-index: 0;
        animation: bgPulse 1s ease-in-out infinite alternate;
    }

    .flame {
        position: absolute;
        bottom: -60px;
        border-radius: 60% 60% 0 0;
        animation: flickerHard 0.15s ease-in-out infinite alternate;
    }

    .big-spark {
        position: absolute;
        border-radius: 50%;
        animation: bigSparkUp 1s ease-out infinite;
    }

    .spark-trail {
        position: absolute;
        width: 2px;
        height: 20px;
        border-radius: 50%;
        animation: trailUp 0.8s ease-out infinite;
        transform-origin: bottom;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    @keyframes slideDown { from { transform: translateY(-60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes scaleIn { from { transform: scale(0.1); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    @keyframes fireShine {
        0% { filter: drop-shadow(0 0 50px #ff4400) drop-shadow(0 0 100px #ff6600); }
        50% { filter: drop-shadow(0 0 80px #ffaa00) drop-shadow(0 0 150px #ff3300) drop-shadow(0 0 200px #ff0000); }
        100% { filter: drop-shadow(0 0 60px #ff8800) drop-shadow(0 0 120px #ff4400) drop-shadow(0 0 180px #ff0000); }
    }
    @keyframes pulseGlow {
        0%, 100% { text-shadow: 0 0 20px #ff8800; }
        50% { text-shadow: 0 0 60px #ffaa00, 0 0 100px #ff6600, 0 0 150px #ff0000; }
    }
    @keyframes bgPulse {
        0% { transform: scaleY(1); opacity: 0.8; }
        100% { transform: scaleY(1.1); opacity: 1; }
    }
    @keyframes flickerHard {
        0% { transform: scaleY(0.8) scaleX(1.2) translateY(0); }
        30% { transform: scaleY(1.3) scaleX(0.7) translateY(-15px); }
        60% { transform: scaleY(1.1) scaleX(0.9) translateY(-10px); }
        100% { transform: scaleY(0.9) scaleX(1.1) translateY(-5px); }
    }
    @keyframes bigSparkUp {
        0% { transform: translateY(0) translateX(0) scale(1); opacity: 1; }
        30% { transform: translateY(-100px) translateX(15px) scale(0.7); opacity: 0.9; }
        70% { transform: translateY(-250px) translateX(-20px) scale(0.3); opacity: 0.5; }
        100% { transform: translateY(-400px) translateX(30px) scale(0); opacity: 0; }
    }
    @keyframes trailUp {
        0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
        100% { transform: translateY(-300px) rotate(45deg); opacity: 0; }
    }
</style>
{% endblock %}

{% block content %}
{{ block.super }}

<div class="welcome-overlay" id="welcomeOverlay">
    <div class="bg-fire"></div>
    <div id="flamesContainer" style="position:absolute;bottom:0;left:0;width:100%;height:60%;z-index:1;"></div>

    <div class="welcome-text">
        <div class="hello">Здравствуй,</div>
        <div class="father">отец</div>
        <div class="subtitle">добро пожаловать</div>
    </div>
</div>

<script>
    function createFireShow() {
        var container = document.getElementById('flamesContainer');
        var colors = ['#ffffff', '#ffdd00', '#ff9900', '#ff6600', '#ff3300', '#ff0000', '#ffaa00', '#ff4400', '#ffbb00'];

        // Пламя - огромное и яркое
        for (var i = 0; i < 150; i++) {
            var flame = document.createElement('div');
            flame.className = 'flame';
            flame.style.left = Math.random() * 100 + '%';
            flame.style.width = (Math.random() * 80 + 40) + 'px';
            flame.style.height = (Math.random() * 200 + 100) + 'px';
            flame.style.background = colors[Math.floor(Math.random() * colors.length)];
            flame.style.animationDelay = Math.random() * 0.2 + 's';
            flame.style.animationDuration = (Math.random() * 0.2 + 0.08) + 's';
            flame.style.zIndex = Math.floor(Math.random() * 15);
            flame.style.opacity = Math.random() * 0.3 + 0.7;
            container.appendChild(flame);
        }

        // Крупные искры
        for (var j = 0; j < 80; j++) {
            var spark = document.createElement('div');
            spark.className = 'big-spark';
            spark.style.left = (5 + Math.random() * 90) + '%';
            spark.style.bottom = (Math.random() * 50) + '%';
            spark.style.width = (Math.random() * 8 + 3) + 'px';
            spark.style.height = spark.style.width;
            spark.style.background = ['#ffffff','#ffdd00','#ffaa00','#ff6600','#ffcc00'][Math.floor(Math.random()*5)];
            spark.style.boxShadow = '0 0 ' + (Math.random()*15+5) + 'px ' + spark.style.background;
            spark.style.animationDelay = Math.random() * 1 + 's';
            spark.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
            container.appendChild(spark);
        }

        // Следы от искр
        for (var t = 0; t < 40; t++) {
            var trail = document.createElement('div');
            trail.className = 'spark-trail';
            trail.style.left = (10 + Math.random() * 80) + '%';
            trail.style.bottom = (Math.random() * 40) + '%';
            trail.style.background = 'linear-gradient(to top, #ffaa00, transparent)';
            trail.style.animationDelay = Math.random() * 0.8 + 's';
            trail.style.animationDuration = (Math.random() * 0.6 + 0.3) + 's';
            container.appendChild(trail);
        }
    }

    document.querySelector('#login-form').addEventListener('submit', function() {
        if (document.querySelector('input[name="password"]').value === 'hianton') {
            sessionStorage.setItem('welcome', '1');
        }
    });

    if (sessionStorage.getItem('welcome') === '1') {
        sessionStorage.removeItem('welcome');
        var overlay = document.getElementById('welcomeOverlay');
        createFireShow();
        overlay.classList.add('show');
        setTimeout(function() {
            overlay.classList.add('hide');
            setTimeout(function() { overlay.remove(); }, 1500);
        }, 8000);
    }
</script>
{% endblock %}
