{% extends "admin/login.html" %}

{% block content %}
{{ block.super }}

{% if request.session.show_admin_welcome %}
<div id="welcomeOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center, #0a0a2e 0%, #000 100%);z-index:99999;display:flex;justify-content:center;align-items:center;overflow:hidden;">

    <!-- Частицы -->
    <div id="particles" style="position:absolute;top:0;left:0;width:100%;height:100%;"></div>

    <!-- Сияние -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(100,150,255,0.15),rgba(80,120,255,0.05) 40%,transparent 70%);border-radius:50%;animation:glow 2s ease-in-out infinite alternate;"></div>

    <!-- Текст -->
    <div style="z-index:10;text-align:center;">
        <div style="font-size:28px;color:rgba(255,255,255,0.7);letter-spacing:6px;margin-bottom:20px;animation:fadeUp 1s ease 0.3s both;">Добро пожаловать,</div>
        <div style="font-size:100px;font-weight:700;letter-spacing:8px;background:linear-gradient(135deg,#667eea,#764ba2,#f093fb,#667eea);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 3s ease infinite,scaleIn 0.8s ease 0.6s both;">отец</div>
        <div style="font-size:20px;color:rgba(255,255,255,0.5);letter-spacing:8px;margin-top:25px;animation:fadeUp 1s ease 1s both;">рады видеть вас снова</div>
    </div>
</div>

<style>
    @keyframes glow {
        0% { transform: translate(-50%,-50%) scale(1); opacity: 0.6; }
        100% { transform: translate(-50%,-50%) scale(1.3); opacity: 1; }
    }
    @keyframes fadeUp {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    @keyframes scaleIn {
        from { transform: scale(0.3); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
</style>

<script>
    // Создаём частицы
    var p = document.getElementById('particles');
    for (var i = 0; i < 100; i++) {
        var dot = document.createElement('div');
        var size = Math.random() * 4 + 1;
        dot.style.cssText = 'position:absolute;left:' + Math.random()*100 + '%;top:' + Math.random()*100 + '%;width:' + size + 'px;height:' + size + 'px;background:rgba(255,255,255,' + (Math.random()*0.5+0.2) + ');border-radius:50%;animation:float ' + (Math.random()*4+3) + 's ease-in-out infinite;animation-delay:' + Math.random()*4 + 's;';
        p.appendChild(dot);
    }

    // Убираем анимацию через 6 секунд
    setTimeout(function() {
        var overlay = document.getElementById('welcomeOverlay');
        if (overlay) {
            overlay.style.transition = 'opacity 1s';
            overlay.style.opacity = '0';
            setTimeout(function() { overlay.remove(); }, 1000);
        }
    }, 6000);

    @keyframes float {
        0%, 100% { transform: translateY(0) translateX(0); }
        25% { transform: translateY(-20px) translateX(10px); }
        50% { transform: translateY(-10px) translateX(-15px); }
        75% { transform: translateY(-30px) translateX(5px); }
    }
</script>
{% endif %}
{% endblock %}
