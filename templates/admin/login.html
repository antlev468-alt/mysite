{% extends "admin/login.html" %}

{% block content %}
{{ block.super }}

<style>
    .welcome-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 99999;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: fadeOut 1.5s 8s forwards;
    }
    @keyframes fadeOut {
        to { opacity: 0; pointer-events: none; }
    }
    @keyframes bgPulse {
        0% { transform: scaleY(1); opacity: 0.8; }
        100% { transform: scaleY(1.1); opacity: 1; }
    }
    @keyframes slideDown {
        from { transform: translateY(-60px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideUp {
        from { transform: translateY(60px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    @keyframes scaleIn {
        from { transform: scale(0.1); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    @keyframes fireShine {
        0% { filter: drop-shadow(0 0 50px #f40) drop-shadow(0 0 100px #f60); }
        50% { filter: drop-shadow(0 0 80px #fa0) drop-shadow(0 0 150px #f30); }
        100% { filter: drop-shadow(0 0 60px #f80) drop-shadow(0 0 120px #f40); }
    }
    @keyframes pulseGlow {
        0%, 100% { text-shadow: 0 0 20px #f80; }
        50% { text-shadow: 0 0 60px #fa0, 0 0 100px #f60; }
    }
    @keyframes flicker {
        0% { transform: scaleY(0.8) scaleX(1.2) translateY(0); }
        30% { transform: scaleY(1.3) scaleX(0.7) translateY(-15px); }
        100% { transform: scaleY(0.9) scaleX(1.1) translateY(-5px); }
    }
    @keyframes spark {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-400px) scale(0); opacity: 0; }
    }
    @keyframes shineGreen {
        0% { filter: drop-shadow(0 0 50px #0f0); }
        50% { filter: drop-shadow(0 0 80px #0f8) drop-shadow(0 0 150px #0f0); }
        100% { filter: drop-shadow(0 0 60px #0c6) drop-shadow(0 0 120px #0f0); }
    }
    @keyframes pulseGreen {
        0%, 100% { text-shadow: 0 0 20px #0c0; }
        50% { text-shadow: 0 0 60px #0f8, 0 0 100px #0c0; }
    }
</style>

{% if request.GET.welcome == 'father' %}
<div class="welcome-overlay" id="welcomeOverlay">
    <div style="position:absolute;bottom:-100px;left:-10%;width:120%;height:70%;background:radial-gradient(ellipse at center bottom,rgba(255,100,0,0.6) 0%,rgba(255,50,0,0.4) 30%,transparent 80%);animation:bgPulse 1s infinite alternate;"></div>
    <div id="flamesContainer" style="position:absolute;bottom:0;left:0;width:100%;height:60%;"></div>
    <div style="z-index:10;text-align:center;">
        <div style="font-size:36px;color:#ffd699;letter-spacing:8px;margin-bottom:25px;animation:slideDown .8s .3s both;">Здравствуй,</div>
        <div style="font-size:120px;font-weight:900;letter-spacing:10px;background:linear-gradient(#fff,#fd0 20%,#f80 40%,#f20 60%,#f80 80%,#fc0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:scaleIn .6s .5s both,fireShine .3s infinite alternate;filter:drop-shadow(0 0 50px #f40) drop-shadow(0 0 100px #f60) drop-shadow(0 0 150px #f00);">отец</div>
        <div style="font-size:24px;color:#fc6;letter-spacing:10px;margin-top:30px;animation:slideUp .8s 1s both,pulseGlow 1s 2s infinite;">добро пожаловать</div>
    </div>
</div>
<script>
var c=document.getElementById('flamesContainer');
var o=['#fff','#fd0','#f90','#f60','#f30','#f00','#fa0','#f40'];
for(var i=0;i<150;i++){var f=document.createElement('div');f.style.cssText='position:absolute;left:'+Math.random()*100+'%;bottom:-60px;width:'+(Math.random()*80+40)+'px;height:'+(Math.random()*200+100)+'px;background:'+o[Math.floor(Math.random()*8)]+';border-radius:60% 60% 0 0;animation:flicker '+(Math.random()*.2+.08)+'s infinite alternate;animation-delay:'+Math.random()*.2+'s;opacity:'+(Math.random()*.3+.7);c.appendChild(f)}
for(var j=0;j<80;j++){var s=document.createElement('div');s.style.cssText='position:absolute;left:'+(5+Math.random()*90)+'%;bottom:'+Math.random()*50+'%;width:'+(Math.random()*8+3)+'px;height:'+s.style.width+';background:'+['#fff','#fd0','#fa0','#f60','#fc0'][Math.floor(Math.random()*5)]+';border-radius:50%;box-shadow:0 0 '+(Math.random()*15+5)+'px '+s.style.background+';animation:spark '+(Math.random()*1+.5)+'s infinite;animation-delay:'+Math.random()*1+'s';c.appendChild(s)}
setTimeout(function(){var o=document.getElementById('welcomeOverlay');if(o)o.remove()},9500);
</script>
{% endif %}

{% if request.GET.welcome == 'friend' %}
<div class="welcome-overlay" id="welcomeOverlay">
    <div style="position:absolute;bottom:-100px;left:-10%;width:120%;height:70%;background:radial-gradient(ellipse at center bottom,rgba(0,255,100,0.4) 0%,rgba(0,200,50,0.3) 30%,transparent 80%);animation:bgPulse 1s infinite alternate;"></div>
    <div id="flamesContainer" style="position:absolute;bottom:0;left:0;width:100%;height:60%;"></div>
    <div style="z-index:10;text-align:center;">
        <div style="font-size:36px;color:#99ffcc;letter-spacing:8px;margin-bottom:25px;animation:slideDown .8s .3s both;">Приветствую,</div>
        <div style="font-size:120px;font-weight:900;letter-spacing:10px;background:linear-gradient(#fff,#0f8 20%,#0c6 40%,#090 60%,#0c6 80%,#0f8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:scaleIn .6s .5s both,shineGreen .3s infinite alternate;filter:drop-shadow(0 0 50px #0f0) drop-shadow(0 0 100px #0c0) drop-shadow(0 0 150px #090);">друг</div>
        <div style="font-size:24px;color:#6fc;letter-spacing:10px;margin-top:30px;animation:slideUp .8s 1s both,pulseGreen 1s 2s infinite;">рад тебя видеть</div>
    </div>
</div>
<script>
var c=document.getElementById('flamesContainer');
var o=['#fff','#0f0','#0f8','#0c6','#090','#0a0','#0fa','#0c0'];
for(var i=0;i<150;i++){var f=document.createElement('div');f.style.cssText='position:absolute;left:'+Math.random()*100+'%;bottom:-60px;width:'+(Math.random()*80+40)+'px;height:'+(Math.random()*200+100)+'px;background:'+o[Math.floor(Math.random()*8)]+';border-radius:60% 60% 0 0;animation:flicker '+(Math.random()*.2+.08)+'s infinite alternate;animation-delay:'+Math.random()*.2+'s;opacity:'+(Math.random()*.3+.7);c.appendChild(f)}
for(var j=0;j<80;j++){var s=document.createElement('div');s.style.cssText='position:absolute;left:'+(5+Math.random()*90)+'%;bottom:'+Math.random()*50+'%;width:'+(Math.random()*8+3)+'px;height:'+s.style.width+';background:'+['#fff','#0f0','#0f8','#0c6','#0fc'][Math.floor(Math.random()*5)]+';border-radius:50%;box-shadow:0 0 '+(Math.random()*15+5)+'px '+s.style.background+';animation:spark '+(Math.random()*1+.5)+'s infinite;animation-delay:'+Math.random()*1+'s';c.appendChild(s)}
setTimeout(function(){var o=document.getElementById('welcomeOverlay');if(o)o.remove()},9500);
</script>
{% endif %}

<script>
document.querySelector('#login-form').addEventListener('submit', function() {
    var p = document.querySelector('input[name="password"]').value;
    if (p === 'hianton') {
        this.action = this.action.split('?')[0] + '?welcome=father';
    } else if (p === 'drug') {
        this.action = this.action.split('?')[0] + '?welcome=friend';
    }
});
</script>
{% endblock %}
