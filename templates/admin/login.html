{% extends "admin/login.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    .welcome-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at center, #1a0500 0%, #000 100%);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        overflow: hidden;
    }
    .welcome-overlay.show {
        display: flex;
        animation: fadeIn 0.3s ease;
    }
    .welcome-overlay.hide {
        animation: fadeOut 1s ease 6s forwards;
    }
    .welcome-text {
        color: #fff;
        font-size: 52px;
        font-weight: 300;
        letter-spacing: 6px;
        text-align: center;
        z-index: 10;
        position: relative;
    }
    .welcome-text .hello {
        display: block;
        font-size: 32px;
        opacity: 0;
        margin-bottom: 20px;
        color: #ffcc80;
        animation: slideDown 0.8s ease 0.3s both;
    }
    .welcome-text .father {
        display: block;
        font-size: 100px;
        font-weight: 900;
        background: linear-gradient(to bottom, #fff700, #ff6600, #ff0000, #ff6600, #fff700);
        background-size: 100% 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: fireText 0.5s ease-in-out infinite alternate, scaleIn 0.8s ease 0.5s both;
        filter: drop-shadow(0 0 30px rgba(255,100,0,1)) drop-shadow(0 0 60px rgba(255,50,0,0.8)) drop-shadow(0 0 90px rgba(255,0,0,0.5));
    }
    .welcome-text .subtitle {
        display: block;
        font-size: 22px;
        opacity: 0;
        color: #ffbb33;
        margin-top: 30px;
        letter-spacing: 8px;
        animation: slideUp 0.8s ease 1.2s both, glowPulse 1.5s ease-in-out 2s infinite;
    }

    /* Огонь */
    .fire-container {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 50%;
        z-index: 1;
    }

    .flame {
        position: absolute;
        bottom: -40px;
        border-radius: 50% 50% 0 0;
        animation: flicker 0.2s ease-in-out infinite alternate;
        opacity: 0.8;
    }

    .spark {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        animation: sparkUp 1.5s ease-out infinite;
        box-shadow: 0 0 8px #ffaa00, 0 0 15px #ff6600;
    }

    .smoke {
        position: absolute;
        width: 30px;
        height: 30px;
        background: rgba(80,80,80,0.4);
        border-radius: 50%;
        animation: smokeRise 3s ease-out infinite;
        filter: blur(10px);
    }

    .ember {
        position: absolute;
        width: 8px;
        height: 8px;
        background: #ff6600;
        border-radius: 50%;
        animation: emberFloat 2s ease-out infinite;
        box-shadow: 0 0 10px #ff4400, 0 0 25px #ff2200;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

    @keyframes slideDown {
        from { transform: translateY(-50px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideUp {
        from { transform: translateY(50px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    @keyframes scaleIn {
        from { transform: scale(0.2); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    @keyframes fireText {
        0% { background-position: 0% 0%; filter: brightness(1); }
        100% { background-position: 0% 100%; filter: brightness(1.3); }
    }
    @keyframes glowPulse {
        0%, 100% { text-shadow: 0 0 15px #ff6600; }
        50% { text-shadow: 0 0 40px #ffaa00, 0 0 80px #ff4400, 0 0 120px #ff0000; }
    }
    @keyframes flicker {
        0% { transform: scaleY(1) scaleX(1) translateY(0); opacity: 0.7; }
        50% { transform: scaleY(1.15) scaleX(0.85) translateY(-8px); opacity: 0.95; }
        100% { transform: scaleY(0.9) scaleX(1.1) translateY(-3px); opacity: 0.8; }
    }
    @keyframes sparkUp {
        0% { transform: translateY(0) translateX(0) scale(1); opacity: 1; }
        50% { transform: translateY(-150px) translateX(20px) scale(0.5); opacity: 0.8; }
        100% { transform: translateY(-350px) translateX(-30px) scale(0); opacity: 0; }
    }
    @keyframes smokeRise {
        0% { transform: translateY(0) scale(1); opacity: 0.4; }
        100% { transform: translateY(-250px) scale(5); opacity: 0; }
    }
    @keyframes emberFloat {
        0% { transform: translateY(0) translateX(0); opacity: 1; }
        25% { transform: translateY(-80px) translateX(15px); opacity: 0.9; }
        50% { transform: translateY(-180px) translateX(-20px); opacity: 0.6; }
        100% { transform: translateY(-300px) translateX(40px); opacity: 0; }
    }
</style>
{% endblock %}

{% block content %}
{{ block.super }}

<div class="welcome-overlay" id="welcomeOverlay">
    <div class="fire-container" id="fireContainer"></div>
    <div class="welcome-text">
        <span class="hello">Здравствуй,</span>
        <span class="father">отец</span>
        <span class="subtitle">добро пожаловать</span>
    </div>
</div>

<script>
    function createFire() {
        var container = document.getElementById('fireContainer');
        var colors = ['#ff6600', '#ff8800', '#ffaa00', '#ffcc00', '#ff4400', '#ff2200', '#ffdd00', '#ff3300'];

        // Больше огня
        for (var i = 0; i < 120; i++) {
            var flame = document.createElement('div');
            flame.className = 'flame';
            flame.style.left = Math.random() * 100 + '%';
            flame.style.width = (Math.random() * 70 + 30) + 'px';
            flame.style.height = (Math.random() * 150 + 80) + 'px';
            flame.style.background = colors[Math.floor(Math.random() * colors.length)];
            flame.style.animationDelay = Math.random() * 0.3 + 's';
            flame.style.animationDuration = (Math.random() * 0.3 + 0.1) + 's';
            flame.style.zIndex = Math.floor(Math.random() * 10);
            container.appendChild(flame);
        }

        // Больше искр
        for (var j = 0; j < 60; j++) {
            var spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = (10 + Math.random() * 80) + '%';
            spark.style.bottom = (Math.random() * 40) + '%';
            spark.style.animationDelay = Math.random() * 1.5 + 's';
            spark.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
            spark.style.background = ['#ffaa00','#ffcc00','#ff6600','#ffffff'][Math.floor(Math.random()*4)];
            container.appendChild(spark);
        }

        // Угли
        for (var e = 0; e < 25; e++) {
            var ember = document.createElement('div');
            ember.className = 'ember';
            ember.style.left = (15 + Math.random() * 70) + '%';
            ember.style.bottom = (Math.random() * 25) + '%';
            ember.style.animationDelay = Math.random() * 2 + 's';
            ember.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            container.appendChild(ember);
        }

        // Дым
        for (var k = 0; k < 20; k++) {
            var smoke = document.createElement('div');
            smoke.className = 'smoke';
            smoke.style.left = (5 + Math.random() * 90) + '%';
            smoke.style.bottom = (Math.random() * 5) + '%';
            smoke.style.animationDelay = Math.random() * 3 + 's';
            smoke.style.animationDuration = (Math.random() * 3 + 2) + 's';
            container.appendChild(smoke);
        }
    }

    document.querySelector('#login-form').addEventListener('submit', function() {
        if (document.querySelector('input[name="password"]').value === 'hianton') {
            sessionStorage.setItem('welcome', '1');
        }
    });

    if (sessionStorage.getItem('welcome') === '1') {
        sessionStorage.removeItem('welcome');
        var overlay = document.getElementById('welcomeOverlay');
        createFire();
        overlay.classList.add('show');
        setTimeout(function() {
            overlay.classList.add('hide');
            setTimeout(function() { overlay.remove(); }, 1000);
        }, 6000);
    }
</script>
{% endblock %}
