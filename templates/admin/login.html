{% extends "admin/login.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    .welcome-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at center, #1a0a00 0%, #0a0000 100%);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        overflow: hidden;
    }
    .welcome-overlay.show {
        display: flex;
        animation: fadeIn 0.5s ease;
    }
    .welcome-overlay.hide {
        animation: fadeOut 1s ease 5s forwards;
    }
    .welcome-text {
        color: #fff;
        font-size: 48px;
        font-weight: 300;
        letter-spacing: 4px;
        text-align: center;
        z-index: 10;
        position: relative;
    }
    .welcome-text .hello {
        display: block;
        font-size: 28px;
        opacity: 0.9;
        margin-bottom: 15px;
        animation: slideDown 1s ease 0.3s both;
    }
    .welcome-text .father {
        display: block;
        font-size: 90px;
        font-weight: 900;
        background: linear-gradient(to bottom, #ff4500, #ff6a00, #ffd700, #ff4500);
        background-size: 100% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: fireText 0.8s ease-in-out infinite alternate, scaleIn 1s ease 0.6s both;
        text-shadow: none;
        filter: drop-shadow(0 0 20px rgba(255,69,0,0.8)) drop-shadow(0 0 40px rgba(255,140,0,0.5));
    }
    .welcome-text .subtitle {
        display: block;
        font-size: 20px;
        opacity: 0;
        color: #ffaa00;
        margin-top: 25px;
        letter-spacing: 6px;
        animation: slideUp 1s ease 1.2s both, glow 2s ease-in-out 2s infinite;
    }

    /* Огонь */
    .fire-container {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 40%;
        z-index: 1;
    }
    .flame {
        position: absolute;
        bottom: -50px;
        border-radius: 50% 50% 0 0;
        animation: flicker 0.3s ease-in-out infinite alternate;
        opacity: 0.7;
    }

    /* Искры */
    .spark {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #ffaa00;
        border-radius: 50%;
        animation: sparkUp 2s ease-out infinite;
        box-shadow: 0 0 6px #ff6600;
    }

    /* Дым */
    .smoke {
        position: absolute;
        width: 20px;
        height: 20px;
        background: rgba(100,100,100,0.3);
        border-radius: 50%;
        animation: smokeRise 4s ease-out infinite;
        filter: blur(8px);
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

    @keyframes slideDown {
        from { transform: translateY(-40px); opacity: 0; }
        to { transform: translateY(0); opacity: 0.9; }
    }
    @keyframes slideUp {
        from { transform: translateY(40px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    @keyframes scaleIn {
        from { transform: scale(0.3); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    @keyframes fireText {
        0% { background-position: 0% 0%; }
        100% { background-position: 0% 100%; }
    }
    @keyframes glow {
        0%, 100% { text-shadow: 0 0 10px #ff6600; }
        50% { text-shadow: 0 0 30px #ffaa00, 0 0 60px #ff4400; }
    }
    @keyframes flicker {
        0% { transform: scaleY(1) scaleX(1) translateY(0); opacity: 0.7; }
        100% { transform: scaleY(1.1) scaleX(0.9) translateY(-5px); opacity: 0.9; }
    }
    @keyframes sparkUp {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-300px) scale(0); opacity: 0; }
    }
    @keyframes smokeRise {
        0% { transform: translateY(0) scale(1); opacity: 0.3; }
        100% { transform: translateY(-200px) scale(3); opacity: 0; }
    }
</style>
{% endblock %}

{% block content %}
{{ block.super }}

<div class="welcome-overlay" id="welcomeOverlay">
    <!-- Огонь -->
    <div class="fire-container" id="fireContainer"></div>

    <!-- Текст -->
    <div class="welcome-text">
        <span class="hello">Здравствуй,</span>
        <span class="father">отец</span>
        <span class="subtitle">добро пожаловать</span>
    </div>
</div>

<script>
    // Создаём огонь
    function createFire() {
        var container = document.getElementById('fireContainer');
        var colors = ['#ff4500', '#ff6600', '#ff8c00', '#ffaa00', '#ffcc00', '#ff2200'];

        for (var i = 0; i < 80; i++) {
            var flame = document.createElement('div');
            flame.className = 'flame';
            flame.style.left = Math.random() * 100 + '%';
            flame.style.width = (Math.random() * 60 + 30) + 'px';
            flame.style.height = (Math.random() * 120 + 60) + 'px';
            flame.style.background = colors[Math.floor(Math.random() * colors.length)];
            flame.style.animationDelay = Math.random() * 0.5 + 's';
            flame.style.animationDuration = (Math.random() * 0.4 + 0.2) + 's';
            flame.style.zIndex = Math.floor(Math.random() * 5);
            container.appendChild(flame);
        }

        // Искры
        for (var j = 0; j < 30; j++) {
            var spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = Math.random() * 100 + '%';
            spark.style.bottom = (Math.random() * 30) + '%';
            spark.style.animationDelay = Math.random() * 2 + 's';
            spark.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            container.appendChild(spark);
        }

        // Дым
        for (var k = 0; k < 15; k++) {
            var smoke = document.createElement('div');
            smoke.className = 'smoke';
            smoke.style.left = Math.random() * 100 + '%';
            smoke.style.bottom = (Math.random() * 10) + '%';
            smoke.style.animationDelay = Math.random() * 4 + 's';
            smoke.style.animationDuration = (Math.random() * 3 + 3) + 's';
            container.appendChild(smoke);
        }
    }

    // Запоминаем пароль hianton
    document.querySelector('#login-form').addEventListener('submit', function() {
        if (document.querySelector('input[name="password"]').value === 'hianton') {
            sessionStorage.setItem('welcome', '1');
        }
    });

    // Показываем заставку
    if (sessionStorage.getItem('welcome') === '1') {
        sessionStorage.removeItem('welcome');
        var overlay = document.getElementById('welcomeOverlay');
        createFire();
        overlay.classList.add('show');
        setTimeout(function() {
            overlay.classList.add('hide');
            setTimeout(function() { overlay.remove(); }, 1000);
        }, 5000);
    }
</script>
{% endblock %}
