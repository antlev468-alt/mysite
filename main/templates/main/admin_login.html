{% extends 'main/base.html' %}
{% block title %}Вход в админку{% endblock %}
{% block content %}
<style>
    .login-box {
        max-width: 400px;
        margin: 100px auto;
        padding: 40px;
        background: #1a1a2e;
        border-radius: 15px;
        text-align: center;
        color: #fff;
        box-shadow: 0 0 30px rgba(79,172,254,0.3);
    }
    .login-box input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #333;
        border-radius: 8px;
        background: #0a0a1a;
        color: #fff;
        font-size: 16px;
    }
    .login-box button {
        padding: 12px 40px;
        background: linear-gradient(45deg, #4facfe, #00f2fe);
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }
    .error { color: #ff4444; margin-top: 10px; }

    .welcome-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 99999;
        display: none;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }
    .welcome-overlay.show { display: flex; }

    @keyframes glow {
        0% { transform: translate(-50%,-50%) scale(1); opacity: 0.6; }
        100% { transform: translate(-50%,-50%) scale(1.3); opacity: 1; }
    }
    @keyframes fadeUp {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    @keyframes scaleIn {
        from { transform: scale(0.3); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes float {
        0%, 100% { transform: translateY(0) translateX(0); }
        25% { transform: translateY(-20px) translateX(10px); }
        50% { transform: translateY(-10px) translateX(-15px); }
        75% { transform: translateY(-30px) translateX(5px); }
    }
</style>

<div class="login-box" id="loginBox">
    <h2>Вход в админку</h2>
    <form method="post" id="loginForm">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Логин" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>
    {% if error %}
        <p class="error">Неверный логин или пароль</p>
    {% endif %}
</div>

<div class="welcome-overlay" id="welcomeOverlay">
    <div id="particles" style="position:absolute;top:0;left:0;width:100%;height:100%;"></div>
    <div id="glowCircle" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;border-radius:50%;animation:glow 2s ease-in-out infinite alternate;"></div>
    <div style="z-index:10;text-align:center;padding:20px;">
        <div id="welcomeLine1" style="font-size:28px;letter-spacing:6px;margin-bottom:20px;animation:fadeUp 1s ease 0.3s both;"></div>
        <div id="welcomeLine2" style="font-size:80px;font-weight:700;letter-spacing:8px;display:inline-block;animation:scaleIn 0.8s ease 0.6s both;"></div>
        <div id="welcomeLine3" style="font-size:20px;letter-spacing:8px;margin-top:25px;animation:fadeUp 1s ease 1s both;"></div>
    </div>
</div>

<script>
    var p = document.getElementById('particles');
    for (var i = 0; i < 100; i++) {
        var dot = document.createElement('div');
        var size = Math.random() * 4 + 1;
        dot.style.cssText = 'position:absolute;left:' + Math.random()*100 + '%;top:' + Math.random()*100 + '%;width:' + size + 'px;height:' + size + 'px;background:rgba(255,255,255,' + (Math.random()*0.5+0.2) + ');border-radius:50%;animation:float ' + (Math.random()*4+3) + 's ease-in-out infinite;animation-delay:' + Math.random()*4 + 's;';
        p.appendChild(dot);
    }

    function showWelcome(type) {
        var line1 = document.getElementById('welcomeLine1');
        var line2 = document.getElementById('welcomeLine2');
        var line3 = document.getElementById('welcomeLine3');
        var glow = document.getElementById('glowCircle');
        var overlay = document.getElementById('welcomeOverlay');

        if (type === 'father') {
            overlay.style.background = 'radial-gradient(ellipse at center, #0a0a2e 0%, #000 100%)';
            glow.style.background = 'radial-gradient(circle,rgba(100,150,255,0.15),rgba(80,120,255,0.05) 40%,transparent 70%)';
            line1.style.fontSize = '28px';
            line1.style.color = 'rgba(255,255,255,0.7)';
            line1.textContent = 'Добро пожаловать,';

            line2.style.fontSize = '80px';
            line2.style.background = 'linear-gradient(135deg,#667eea,#764ba2,#f093fb,#667eea)';
            line2.style.backgroundSize = '300% 300%';
            line2.style.webkitBackgroundClip = 'text';
            line2.style.webkitTextFillColor = 'transparent';
            line2.style.backgroundClip = 'text';
            line2.style.color = 'transparent';
            line2.style.animation = 'gradientShift 3s ease infinite,scaleIn 0.8s ease 0.6s both';
            line2.textContent = 'отец';

            line3.style.fontSize = '20px';
            line3.style.color = 'rgba(255,255,255,0.5)';
            line3.textContent = 'рады видеть вас снова';

        } else if (type === 'oksana') {
            overlay.style.background = 'radial-gradient(ellipse at center, #1a0a00 0%, #0a0500 100%)';
            glow.style.background = 'radial-gradient(circle,rgba(255,200,50,0.2),rgba(255,150,0,0.08) 40%,transparent 70%)';
            line1.style.fontSize = '42px';
            line1.style.color = '#ffd699';
            line1.textContent = 'О, мудрый вопрошающий!';

            line2.style.fontSize = '0px';
            line2.style.background = 'none';
            line2.style.webkitTextFillColor = '';
            line2.textContent = '';

            line3.style.fontSize = '0px';
            line3.textContent = '';
        }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        var password = document.querySelector('input[name="password"]').value;
        if (password === 'hianton') {
            e.preventDefault();
            document.getElementById('loginBox').style.display = 'none';
            showWelcome('father');
            document.getElementById('welcomeOverlay').classList.add('show');
            setTimeout(function() {
                var overlay = document.getElementById('welcomeOverlay');
                overlay.style.transition = 'opacity 1s';
                overlay.style.opacity = '0';
                setTimeout(function() {
                    document.getElementById('loginForm').submit();
                }, 1000);
            }, 5000);
        } else if (password === 'oksana123') {
            e.preventDefault();
            document.getElementById('loginBox').style.display = 'none';
            showWelcome('oksana');
            document.getElementById('welcomeOverlay').classList.add('show');
            setTimeout(function() {
                var overlay = document.getElementById('welcomeOverlay');
                overlay.style.transition = 'opacity 1s';
                overlay.style.opacity = '0';
                setTimeout(function() {
                    document.getElementById('loginForm').submit();
                }, 1000);
            }, 5000);
        }
    });
</script>
{% endblock %}
