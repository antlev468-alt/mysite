{% extends 'main/base.html' %}
{% block title %}Вход в админку{% endblock %}
{% block content %}
<style>
    .login-box {
        max-width: 400px;
        margin: 100px auto;
        padding: 40px;
        background: #1a1a2e;
        border-radius: 15px;
        text-align: center;
        color: #fff;
        box-shadow: 0 0 30px rgba(79,172,254,0.3);
    }
    .login-box input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #333;
        border-radius: 8px;
        background: #0a0a1a;
        color: #fff;
        font-size: 16px;
    }
    .login-box button {
        padding: 12px 40px;
        background: linear-gradient(45deg, #4facfe, #00f2fe);
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }
    .error {
        color: #ff4444;
        margin-top: 10px;
    }
</style>

<div class="login-box">
    <h2>Вход в админку</h2>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Логин" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>
    {% if error %}
        <p class="error">Неверный логин или пароль</p>
    {% endif %}
</div>
{% endblock %}
