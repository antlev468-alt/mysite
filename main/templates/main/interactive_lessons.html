{% extends 'main/base.html' %}
{% block title %}Интерактивные уроки{% endblock %}
{% block content %}
    <h1>Интерактивные уроки</h1>
    <ul>
        {% for lesson in lessons %}
            <li><a href="{% url 'material_detail' lesson.pk %}">{{ lesson.title }}</a></li>
        {% empty %}
            <li>Пока нет интерактивных уроков.</li>
        {% endfor %}
    </ul>
{% endblock %}
