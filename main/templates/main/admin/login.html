{% extends "admin/login.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    .welcome-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at center, #1a1a2e 0%, #000 100%);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 99999;
    }

    .welcome-overlay.show {
        display: flex;
        animation: fadeIn 0.5s ease;
    }

    .welcome-overlay.hide {
        animation: fadeOut 0.8s ease 3s forwards;
    }

    .welcome-text {
        color: #fff;
        font-size: 48px;
        font-weight: 300;
        letter-spacing: 4px;
        text-align: center;
    }

    .welcome-text .hello {
        display: block;
        font-size: 28px;
        opacity: 0.8;
        margin-bottom: 15px;
    }

    .welcome-text .father {
        display: block;
        font-size: 80px;
        font-weight: 700;
        background: linear-gradient(45deg, #4facfe, #00f2fe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shine 2s ease-in-out infinite;
    }

    .welcome-text .subtitle {
        display: block;
        font-size: 18px;
        opacity: 0.6;
        margin-top: 20px;
    }

    .spark {
        position: absolute;
        width: 3px;
        height: 3px;
        background: #4facfe;
        border-radius: 50%;
        animation: float 4s linear infinite;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes fadeOut {
        to { opacity: 0; visibility: hidden; }
    }

    @keyframes shine {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.5); }
    }

    @keyframes float {
        0% { transform: translateY(100vh) scale(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }
</style>
{% endblock %}

{% block content %}
{{ block.super }}

<div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-text">
        <span class="hello">Здравствуй,</span>
        <span class="father">отец</span>
        <span class="subtitle">добро пожаловать</span>
    </div>
</div>

<script>
    // Проверяем пароль при входе
    document.querySelector('form').addEventListener('submit', function(e) {
        var password = document.querySelector('input[name="password"]').value;
        if (password === 'hianton') {
            localStorage.setItem('showAdminWelcome', 'true');
        }
    });

    // Показываем приветствие после загрузки админки
    window.addEventListener('load', function() {
        if (localStorage.getItem('showAdminWelcome') === 'true') {
            localStorage.removeItem('showAdminWelcome');

            var overlay = document.getElementById('welcomeOverlay');

            // Создаём частицы
            for (var i = 0; i < 50; i++) {
                var spark = document.createElement('div');
                spark.className = 'spark';
                spark.style.left = Math.random() * 100 + '%';
                spark.style.animationDelay = Math.random() * 4 + 's';
                spark.style.animationDuration = (Math.random() * 3 + 2) + 's';
                spark.style.width = (Math.random() * 4 + 1) + 'px';
                spark.style.height = spark.style.width;
                overlay.appendChild(spark);
            }

            overlay.classList.add('show');

            setTimeout(function() {
                overlay.classList.add('hide');
                setTimeout(function() {
                    overlay.remove();
                }, 800);
            }, 3000);
        }
    });
</script>
{% endblock %}
